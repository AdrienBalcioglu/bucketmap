name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hardcode Supabase credentials in source
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.VITE_SUPABASE_URL }}|g" src/lib/supabase-config.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.VITE_SUPABASE_ANON_KEY }}|g" src/lib/supabase-config.js

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          fi